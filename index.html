<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Echographie</h1>

  <!-- HOME -->
<div id="home" class="screen">
  <div class="card">

    <button onclick="showTheory()">📘 Theorie</button>
    <button onclick="startQuiz()">🧠 Quiz</button>

  </div>

  <div class="card">
    <button onclick="setLang('de')">🇩🇪 Deutsch</button>
    <button onclick="setLang('fr')">🇫🇷 Français</button>
  </div>
</div>

  <!-- THEORY -->
  <div id="theory" class="screen" style="display:none;">
    <div id="theoryMenu"></div>
  </div>

  <div id="theoryDetail" class="screen" style="display:none;"></div>

  <!-- QUIZ -->
  <div id="quiz" class="screen" style="display:none;">
    <div id="progressContainer">
      <div id="fill"></div>
    </div>

    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen" style="display:none;">
    <h2 id="score"></h2>
    <div id="results"></div>
  </div>

  <!-- NAV -->
  <div class="nav" id="nav" style="display:none;">
    <button onclick="goHome()">🏠</button>
    <button onclick="restartQuiz()" id="restartBtn">🔄</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
