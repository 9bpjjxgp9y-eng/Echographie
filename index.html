<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Echographie</h1>

  <!-- HOME -->
  <div id="startScreen" class="screen">
    <div class="card">
      <button id="btnTheory" onclick="showTheory()">Theorie</button>
      <button id="btnQuiz" onclick="startQuiz()">Quiz</button>

      <div class="lang">
        <button onclick="setLanguage('de')">🇩🇪</button>
        <button onclick="setLanguage('fr')">🇫🇷</button>
      </div>
    </div>
  </div>

  <!-- THEORY -->
  <div id="theoryScreen" class="screen hidden">
    <div id="theoryMenu"></div>
  </div>

  <div id="theoryDetailScreen" class="screen hidden"></div>

  <!-- QUIZ -->
  <div id="quizScreen" class="screen hidden">
    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>

    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <h2 id="scoreText"></h2>
    <div id="resultList"></div>
  </div>

  <!-- NAV -->
  <div id="nav" class="nav hidden">
    <button onclick="goHome()">🏠</button>
    <button onclick="restartQuiz()">🔄</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
