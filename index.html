<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">
  <h1>📱 Echographie App</h1>

  <button onclick="startQuiz()" id="btnStart">Quiz starten</button>
  <button onclick="showTheory()" id="btnTheory">Theorie</button>

  <div id="langBox">
    <button onclick="setLanguage('de')">🇩🇪</button>
    <button onclick="setLanguage('fr')">🇫🇷</button>
  </div>
</div>

<div id="quizScreen" style="display:none;">
  <h2 id="question"></h2>
  <div id="answers"></div>
</div>

<div id="resultScreen" style="display:none;">
  <h2 id="resultText"></h2>
  <button onclick="goHome()" id="btnHome">Zur Startseite</button>
</div>

<div id="theoryScreen" style="display:none;">
  <h2>📘 Theorie</h2>
  <p id="theoryText"></p>
  <button onclick="goHome()" id="btnBack">Zurück</button>
</div>

<script src="script.js"></script>

</body>
</html>
