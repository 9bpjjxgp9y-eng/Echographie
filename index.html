<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">
  <h1>📱 Echographie App</h1>

  <button onclick="startQuiz()">🧠 Quiz starten</button>
  <button onclick="showTheory()">📘 Theorie</button>

  <br><br>

  <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
  <button onclick="setLanguage('fr')">🇫🇷 Français</button>
</div>

<div id="quizScreen" style="display:none;">
  <h2 id="question"></h2>
  <div id="answers"></div>

  <br>
  <button onclick="goHome()">⬅ Zurück</button>
</div>

<div id="resultScreen" style="display:none;">
  <h2 id="resultText"></h2>
  <button onclick="restart()">🔁 Neustart</button>
</div>

<div id="theoryScreen" style="display:none;">
  <h2>📘 Theorie</h2>
  <p id="theoryText"></p>
  <button onclick="goHome()">⬅ Zurück</button>
</div>

<script src="script.js"></script>

</body>
</html>
