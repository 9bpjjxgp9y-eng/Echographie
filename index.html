<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Echographie App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Echographie</h1>

  <!-- HOME -->
  <div id="homeScreen" class="screen">
    <div class="card">
      <button onclick="showTheoryMenu()">Theorie</button>
      <button onclick="startQuiz()">Quiz</button>

      <div class="lang">
        <button onclick="setLang('de')">DE</button>
        <button onclick="setLang('fr')">FR</button>
      </div>
    </div>
  </div>

  <!-- THEORY -->
  <div id="theoryScreen" class="screen hidden"></div>
  <div id="theoryDetailScreen" class="screen hidden"></div>

  <!-- QUIZ -->
  <div id="quizScreen" class="screen hidden">
    <div class="card">

      <div id="progressContainer">
        <div id="progressBar"></div>
      </div>

      <h2 id="question"></h2>
      <div id="answers"></div>

    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <div class="card">
      <h2 id="score"></h2>
      <div id="results"></div>

      <button onclick="startQuiz()">🔄 Restart Quiz</button>
      <button onclick="goHome()">🏠 Home</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
