<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Echographie</h1>

  <!-- HOME -->
  <div id="startScreen" class="screen">
    <div class="card">
      <button id="btnTheory" onclick="showTheory()">Theorie</button>
      <button id="btnQuiz" onclick="startQuiz()">Quiz</button>

      <div class="lang">
        <button onclick="setLanguage('de')">🇩🇪</button>
        <button onclick="setLanguage('fr')">🇫🇷</button>
      </div>
    </div>
  </div>

  <!-- THEORY -->
  <div id="theoryScreen" class="screen hidden">
    <div class="card" id="theoryMenu"></div>
  </div>

  <div id="theoryDetailScreen" class="screen hidden">
    <div class="card" id="theoryDetail"></div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="screen hidden">
    <div class="card">
      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <h2 id="question"></h2>
      <div id="answers"></div>

      <button class="restart" onclick="restartQuiz()">🔄 Restart</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <div class="card">
      <h2 id="scoreText"></h2>
      <div id="resultList"></div>

      <button onclick="startQuiz()">🔄 Restart</button>
      <button onclick="goHome()">🏠 Home</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
