<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>

<!-- HOME -->
<div id="startScreen" class="screen">
  <h1>Echographie App</h1>

  <button id="btnTheory" onclick="showTheory()"></button>
  <button id="btnQuiz" onclick="startQuiz()"></button>

  <br><br>

  <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
  <button onclick="setLanguage('fr')">🇫🇷 Français</button>
</div>

<!-- THEORY LIST -->
<div id="theoryScreen" class="screen" style="display:none;">
  <h2 id="theoryTitle"></h2>
  <div id="theoryMenu"></div>

  <button onclick="goHome()" id="btnHome1"></button>
</div>

<!-- THEORY DETAIL -->
<div id="theoryDetailScreen" style="display:none;"></div>

<!-- QUIZ -->
<div id="quizScreen" class="screen" style="display:none;">
  <h2 id="question"></h2>
  <div id="answers"></div>

  <button onclick="goHome()" id="btnHome2"></button>
  <button onclick="restartQuiz()" id="btnRestart"></button>
</div>

<!-- RESULT -->
<div id="resultScreen" class="screen" style="display:none;">
  <h2 id="resultText"></h2>

  <button onclick="goHome()" id="btnHome3"></button>
  <button onclick="restartQuiz()" id="btnRestart2"></button>
</div>

<script src="script.js"></script>

</body>
</html>
