<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Echographie</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Echographie</h1>

<!-- HOME -->
<div id="home">
  <button onclick="showTheory()">Theorie</button>
  <button onclick="startQuiz()">Quiz</button>

  <div>
    <button onclick="setLang('de')">Deutsch</button>
    <button onclick="setLang('fr')">Français</button>
  </div>
</div>

<!-- THEORY -->
<div id="theory" class="hidden">
  <div id="theoryList"></div>
  <button onclick="goHome()">🏠 Home</button>
</div>

<div id="theoryDetail" class="hidden"></div>

<!-- QUIZ -->
<div id="quiz" class="hidden">
  <div id="bar"><div id="fill"></div></div>

  <h2 id="q"></h2>
  <div id="a"></div>

  <button onclick="restart()">🔄 Restart</button>
  <button onclick="goHome()">🏠 Home</button>
</div>

<!-- RESULT -->
<div id="result" class="hidden">
  <h2 id="score"></h2>
  <div id="list"></div>

  <button onclick="restart()">🔄 Restart</button>
  <button onclick="goHome()">🏠 Home</button>
</div>

<script src="script.js"></script>
</body>
</html>
