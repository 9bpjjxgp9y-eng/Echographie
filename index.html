<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Echographie</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Echographie</h1>

<!-- HOME -->
<section id="home">
  <button onclick="openTheory()">Theorie</button>
  <button onclick="startQuiz()">Quiz</button>

  <div>
    <button onclick="setLang('de')">Deutsch</button>
    <button onclick="setLang('fr')">Français</button>
  </div>
</section>

<!-- THEORY -->
<section id="theory" class="hidden">
  <div id="theoryList"></div>
  <button onclick="goHome()">🏠 Home</button>
</section>

<section id="theoryDetail" class="hidden"></section>

<!-- QUIZ -->
<section id="quiz" class="hidden">
  <div class="bar"><div id="fill"></div></div>

  <h2 id="question"></h2>
  <div id="answers"></div>

  <button id="restartQuizBtn" onclick="startQuiz()">🔄 Restart</button>
  <button onclick="goHome()">🏠 Home</button>
</section>

<!-- RESULT -->
<section id="result" class="hidden">
  <h2 id="score"></h2>
  <div id="results"></div>

  <button onclick="startQuiz()">🔄 Restart</button>
  <button onclick="goHome()">🏠 Home</button>
</section>

<script src="script.js"></script>
</body>
</html>
