<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>Echographie</h1>

  <!-- HOME -->
  <div id="startScreen" class="screen">
    <div class="card">
      <button id="btnTheory" onclick="showTheory()"></button>
      <button id="btnQuiz" onclick="startQuiz()"></button>
    </div>

    <!-- LANGUAGE -->
    <div class="card">
      <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
      <button onclick="setLanguage('fr')">🇫🇷 Français</button>
    </div>
  </div>

  <!-- THEORY -->
  <div id="theoryScreen" class="screen" style="display:none;">
    <div class="card">
      <div id="theoryMenu"></div>
    </div>
  </div>

  <!-- THEORY DETAIL -->
  <div id="theoryDetailScreen" class="screen" style="display:none;"></div>

  <!-- QUIZ -->
  <div id="quizScreen" class="screen" style="display:none;">
    <div class="card">

      <div id="progressContainer">
        <div id="progressBar"></div>
      </div>

      <h2 id="question"></h2>
      <div id="answers"></div>

    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen" style="display:none;">
    <div class="card">
      <h2 id="scoreText"></h2>
      <div id="resultList"></div>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button onclick="goHome()">🏠</button>
    <button id="restartBtn" onclick="restartQuiz()">🔄</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
