<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ultraschall LernApp - Perfekt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* App Container */
        #app {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 64px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Seiten (jede Seite ist ein screen) */
        .screen {
            display: none;
            padding: 2rem 2rem 2rem 2rem;
            animation: fadeIn 0.25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Header mit Home & Zurück */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .nav-group {
            display: flex;
            gap: 16px;
        }

        button {
            background: #1e293b;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button i { font-style: normal; font-weight: bold; font-size: 1.2rem; }

        button:active { transform: scale(0.96); background: #0f172a;}

        .btn-primary {
            background: #0f3b5c;
            box-shadow: 0 8px 18px rgba(0, 60, 90, 0.3);
        }
        .btn-primary:hover { background: #1e4a76;}

        .btn-quiz { background: #2c3e66; }
        .btn-theory { background: #2b5e3b; }
        .btn-qa { background: #9b4a1f; }

        /* Hauptmenü Buttons */
        .main-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 60px 0 50px;
        }
        .main-btn {
            flex: 1;
            min-width: 200px;
            padding: 28px 20px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 56px;
            justify-content: center;
            background: #2d3e50;
        }

        .sprache-block {
            margin-top: 50px;
            text-align: center;
            background: #eef2ff;
            padding: 20px;
            border-radius: 60px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .lang-btn {
            background: #334155;
            padding: 12px 28px;
            font-size: 1.2rem;
        }

        /* Theorie styling */
        .theory-card {
            background: #f8fafc;
            border-radius: 42px;
            padding: 1.8rem;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            border-left: 8px solid #2b5e3b;
        }
        .theory-card h3 {
            color: #1e3a2f;
            margin-bottom: 12px;
            font-size: 1.6rem;
        }
        .theory-card p {
            line-height: 1.5;
            color: #1e293b;
            font-size: 1rem;
        }

        /* Quiz */
        .quiz-question {
            font-size: 1.7rem;
            font-weight: 700;
            background: #eef2ff;
            padding: 24px;
            border-radius: 48px;
            margin-bottom: 32px;
        }
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .answer-btn {
            background: white;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            justify-content: flex-start;
            text-align: left;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: none;
        }
        .answer-btn:hover:not(:disabled) {
            background: #d9e6f5;
            border-color: #2c3e66;
        }
        .disabled-ans {
            opacity: 0.7;
            pointer-events: none;
        }
        .quiz-footer {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .scoreboard {
            background: #1e293b;
            color: white;
            border-radius: 60px;
            padding: 28px;
            margin-top: 20px;
        }
        .feedback-list {
            margin-top: 24px;
            background: #ffffffdb;
            padding: 20px;
            border-radius: 38px;
        }
        .feedback-item {
            border-bottom: 1px solid #ccc;
            padding: 12px;
            font-size: 0.95rem;
        }

        /* QA Bereich */
        .qa-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .qa-item {
            background: #fff7ed;
            border-radius: 48px;
            padding: 28px;
            border: 1px solid #fed7aa;
        }
        .qa-question {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 16px;
            color: #9b4a1f;
        }
        .qa-answer {
            font-size: 1.2rem;
            background: white;
            padding: 18px;
            border-radius: 40px;
            color: #2d3e50;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72, #2b5876);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        @media (max-width: 680px) {
            .screen { padding: 1.2rem; }
            .main-btn { font-size: 1.3rem; padding: 18px; }
            .quiz-question { font-size: 1.3rem; }
        }
        hr {
            margin: 15px 0;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ============================================= -->
    <!-- HOMESCREEN (Start) -->
    <!-- ============================================= -->
    <div id="home-screen" class="screen active">
        <div style="text-align: center; margin-top: 20px;">
            <h1>📘 SonoMaster</h1>
            <p style="font-size: 1.2rem; margin-bottom: 15px;">Echographie – Lernen mit System</p>
        </div>
        <div class="main-buttons">
            <button class="main-btn btn-theory" id="goto-theory-home">📖 THEORIE</button>
            <button class="main-btn btn-quiz" id="goto-quiz-home">❓ QUIZ</button>
            <button class="main-btn btn-qa" id="goto-qa-home">💬 FRAGE & ANTWORT</button>
        </div>
        <div class="sprache-block">
            <span style="font-weight: 500; align-self: center;">🌐 Sprache / Langue :</span>
            <button class="lang-btn" id="lang-de">DEUTSCH</button>
            <button class="lang-btn" id="lang-fr">FRANÇAIS</button>
        </div>
        <div style="text-align: center; margin-top: 30px; opacity: 0.7; font-size: 0.8rem;">
            ⬅️ Navigation: Home & Zurück jederzeit verfügbar
        </div>
    </div>

    <!-- ============================================= -->
    <!-- THEORIE SEITE (umfangreiche texte) -->
    <!-- ============================================= -->
    <div id="theory-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="theory-home-btn">🏠 HOME</button>
                <button id="theory-back-btn">◀ ZURÜCK</button>
            </div>
            <div><span style="font-weight: bold;">📖 Theorie-Kapitel</span></div>
        </div>
        <div id="theory-content"></div>
    </div>

    <!-- ============================================= -->
    <!-- QUIZ SEITE (15 Fragen, zufällige Antwortreihenfolge, Restart, Score) -->
    <!-- ============================================= -->
    <div id="quiz-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="quiz-home-btn">🏠 HOME</button>
                <button id="quiz-back-btn">◀ ZURÜCK</button>
                <button id="quiz-restart-btn">🔄 RESTART</button>
            </div>
            <div><span id="quiz-progress">Frage 1 / 15</span></div>
        </div>
        <div id="quiz-panel">
            <!-- dynamisch: frage + antworten -->
        </div>
    </div>

    <!-- ============================================= -->
    <!-- FRAGE & ANTWORT SEITE (QA) -->
    <!-- ============================================= -->
    <div id="qa-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="qa-home-btn">🏠 HOME</button>
                <button id="qa-back-btn">◀ ZURÜCK</button>
            </div>
            <div>❓ Q&A Bereich</div>
        </div>
        <div class="qa-container" id="qa-container"></div>
    </div>

</div>

<script>
    // ---------- Sprachtexte (Deutsch / Französisch) ----------
    let currentLang = 'de';   // 'de' oder 'fr'

    // Theorie: Vollständige Texte (Deutsch und Französisch)
    const theoryDe = [
        {title: "📘 1. Einleitung", content: "Die Echographie (Ultraschall) ist ein bildgebendes Verfahren, das hochfrequente Schallwellen nutzt. Es ist strahlungsfrei und zeigt Weichteile in Echtzeit."},
        {title: "🌊 2. Ultraschallwellen", content: "Frequenzen über 20 kHz. In der Diagnostik verwendet man 2–18 MHz. Je höher die Frequenz, desto besser die Auflösung, aber geringere Eindringtiefe."},
        {title: "🔊 3. Kompression & Rarefaktion", content: "Schallwellen bestehen aus Zonen erhöhten Drucks (Kompression) und verminderten Drucks (Rarefaktion). Diese mechanischen Wellen breiten sich im Gewebe aus."},
        {title: "⚡ 4. Impedanz der Gewebe", content: "Die akustische Impedanz ist materialspezifisch. An Grenzflächen unterschiedlicher Impedanz kommt es zu Reflexionen – Grundlage der Bildgebung."},
        {title: "📏 5. Messungen", content: "Man misst Längen, Flächen, Volumina (z.B. fetale Biometrie, Schilddrüsenvolumen). Doppler erlaubt Flussmessungen."},
        {title: "🖥️ 6. Schallkopf-Typen", content: "Linear (oberflächliche Strukturen), Konvex (Abdominal), Phased-Array (Herz). Jeder Typ hat spezifische Frequenz- und Schallfeld-Eigenschaften."},
        {title: "🎯 7. Fazit", content: "Ultraschall ist sicher, nicht-invasiv und vielseitig. Limitationen: Knochen/Luft stören. Ständige technische Weiterentwicklung (3D/4D, Elastographie)."}
    ];

    const theoryFr = [
        {title: "📘 1. Introduction", content: "L'échographie utilise des ondes ultrasonores haute fréquence. Examen sans radiation, visualisation en temps réel des tissus mous."},
        {title: "🌊 2. Ondes ultrasonores", content: "Fréquences >20 kHz. En diagnostic: 2–18 MHz. Fréquence élevée = meilleure résolution mais pénétration moindre."},
        {title: "🔊 3. Compression & Raréfaction", content: "Ondes mécaniques alternant zones de haute pression (compression) et basse pression (raréfaction). Propagation dans les tissus."},
        {title: "⚡ 4. Impédance acoustique", content: "Propre à chaque tissu. Aux interfaces, réflexion des ultrasons → formation de l'image échographique."},
        {title: "📏 5. Mesures", content: "Longueurs, surfaces, volumes (biométrie fœtale, thyroïde). Doppler pour évaluer les flux."},
        {title: "🖥️ 6. Types de sondes", content: "Linéaire (superficiel), Convexe (abdominal), Phased-Array (cardiaque). Chaque sonde a ses propriétés."},
        {title: "🎯 7. Conclusion", content: "Échographie: sûre, non invasive, polyvalente. Limites: os/air. Évolutions 3D/4D, élastographie."}
    ];

    // ----- 15 Quizfragen (vier Antworten, Index der korrekten 0-3) -----
    const quizQuestions = [
        {text: "Welche Frequenzbereiche werden typisch für Abdomensonographie genutzt?", answers: ["2-5 MHz", "10-15 MHz", "20-30 MHz", "<1 MHz"], correct: 0},
        {text: "Was bedeutet Hyperechogen?", answers: ["dunkel / schwarz", "hell / starke Reflexion", "schallfrei", "schwach reflektierend"], correct: 1},
        {text: "Akustische Impedanz ist abhängig von:", answers: ["Dichte & Schallgeschwindigkeit", "nur der Dichte", "Frequenz", "Amplitude"], correct: 0},
        {text: "Welche Schallkopfart eignet sich für Schilddrüsenuntersuchungen?", answers: ["Linear", "Konvex", "Phased Array", "Sektor"], correct: 0},
        {text: "Was versteht man unter Rarefaktion?", answers: ["Verdichtung", "Druckabnahme / Ausdehnung", "Reflexion", "Absorption"], correct: 1},
        {text: "Welcher Effekt ermöglicht die Blutflussdarstellung?", answers: ["Doppler-Effekt", "Kompressions-Effekt", "Rayleigh Streuung", "Kavitation"], correct: 0},
        {text: "Echographie ist besonders gut geeignet für:", answers: ["Knochen", "Lunge (belüftet)", "Weichteile / Parenchym", "Dickdarm mit Luft"], correct: 2},
        {text: "Was bedeutet Anechogen?", answers: ["keine Echos (flüssigkeitsgefüllt)", "sehr hell", "gemischt", "niedrige Frequenz"], correct: 0},
        {text: "Die Auflösung wird mit höherer Frequenz ...", answers: ["besser", "schlechter", "unverändert", "unberechenbar"], correct: 0},
        {text: "Welches Medium lässt Ultraschall kaum passieren?", answers: ["Luft", "Wasser", "Weichteil", "Muskel"], correct: 0},
        {text: "Was misst die Elastographie?", answers: ["Gewebesteifigkeit", "Flussgeschwindigkeit", "Temperatur", "Dichte"], correct: 0},
        {text: "Wie nennt man die Rauschunterdrückung im Bild?", answers: ["Compound", "Harmonic Imaging", "Gain", "Tiefenausgleich"], correct: 1},
        {text: "Welche Art von Welle ist Ultraschall?", answers: ["Longitudinalwelle", "Transversalwelle", "Oberflächenwelle", "elektromagnetisch"], correct: 0},
        {text: "Für Schwangerschaftsuntersuchungen wird Frequenz meist zwischen:", answers: ["3-7 MHz", "12-18 MHz", "20 MHz", "<1 MHz"], correct: 0},
        {text: "Was ist die Rolle des Gels?", answers: ["Luftausschluss / Impedanzanpassung", "Kühlung", "Schalldämpfung", "Fokussierung"], correct: 0}
    ];

    // Französische Version der Fragen
    const quizFr = [
        {text: "Plage de fréquences typique pour l'échographie abdominale ?", answers: ["2-5 MHz", "10-15 MHz", "20-30 MHz", "<1 MHz"], correct: 0},
        {text: "Que signifie hyperéchogène ?", answers: ["foncé / noir", "brillant / forte réflexion", "anéchogène", "faible réflexion"], correct: 1},
        {text: "L'impédance acoustique dépend de :", answers: ["densité & vitesse du son", "densité uniquement", "fréquence", "amplitude"], correct: 0},
        {text: "Quel type de sonde pour la thyroïde ?", answers: ["Linéaire", "Convexe", "Phased-array", "Sectoriel"], correct: 0},
        {text: "Qu'est-ce que la raréfaction ?", answers: ["Compression", "Diminution de pression", "Réflexion", "Absorption"], correct: 1},
        {text: "Quel effet permet d'imager le flux sanguin ?", answers: ["Doppler", "Compression", "Rayleigh", "Cavitation"], correct: 0},
        {text: "L'échographie est adaptée pour :", answers: ["Os", "Poumon aéré", "Tissus mous", "Colon rempli d'air"], correct: 2},
        {text: "Anéchogène signifie :", answers: ["sans écho (liquide)", "très brillant", "mixte", "basse fréquence"], correct: 0},
        {text: "La résolution avec une fréquence plus élevée devient :", answers: ["meilleure", "pire", "identique", "instable"], correct: 0},
        {text: "Quel milieu bloque presque les ultrasons ?", answers: ["Air", "Eau", "Tissus mous", "Muscle"], correct: 0},
        {text: "Que mesure l'élastographie ?", answers: ["Dureté tissulaire", "Vitesse sanguine", "Température", "Densité"], correct: 0},
        {text: "Nom d'une technique de réduction d'artefacts ?", answers: ["Compound", "Harmonic Imaging", "Gain", "TGC"], correct: 1},
        {text: "Type d'onde ultrasonore :", answers: ["Longitudinale", "Transversale", "Ondes de surface", "Électromagnétique"], correct: 0},
        {text: "Échographie obstétricale utilise généralement :", answers: ["3-7 MHz", "12-18 MHz", "20 MHz", "<1 MHz"], correct: 0},
        {text: "Rôle du gel échographique :", answers: ["Éviter l'air / adaptation d'impédance", "Refroidir", "Atténuer", "Focaliser"], correct: 0}
    ];

    function getCurrentQuestions() {
        return currentLang === 'de' ? [...quizQuestions] : [...quizFr];
    }

    // Globale Quiz-Zustände
    let currentQuizQuestions = [];
    let quizIndex = 0;          // 0-14 (aktuelle Frage)
    let userAnswers = new Array(15).fill(null); // gespeicherte Antwort (text oder index)
    let quizFinished = false;
    let currentAnswersOrder = []; // für jede Frage zufällige Reihenfolge der Antwort-Indizes

    // Hilfsfunktionen Zufallsreihenfolge der Antworten pro Frage (initial)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuizOrder() {
        const qCount = currentQuizQuestions.length;
        currentAnswersOrder = [];
        for (let i = 0; i < qCount; i++) {
            let indices = [0,1,2,3];
            shuffleArray(indices);
            currentAnswersOrder.push(indices);
        }
    }

    // Quiz anzeigen (Fragestellung + gemischte Antworten)
    function renderCurrentQuestion() {
        const container = document.getElementById("quiz-panel");
        if (!container) return;
        if (quizFinished) {
            showScoreScreen();
            return;
        }
        const q = currentQuizQuestions[quizIndex];
        const order = currentAnswersOrder[quizIndex];
        const shuffledAnswers = order.map(idx => q.answers[idx]);
        const correctOrigIndex = q.correct;
        // Finde aktuell den richtigen Button-index im gemischten Array (für Validierung)
        // Aber wir speichern gewählte Antwort getrennt.
        const progressSpan = document.getElementById("quiz-progress");
        if(progressSpan) progressSpan.innerText = `Frage ${quizIndex+1} / ${currentQuizQuestions.length}`;

        let html = `<div class="quiz-question">${quizIndex+1}. ${q.text}</div>`;
        html += `<div class="answers-grid" id="answers-grid">`;
        shuffledAnswers.forEach((ans, idx) => {
            html += `<button class="answer-btn" data-answer-idx="${idx}" data-answer-text="${ans.replace(/"/g, '&quot;')}">${ans}</button>`;
        });
        html += `</div><div class="quiz-footer"><button id="next-quiz-btn" style="background:#2c3e66;">➡ Nächste Frage</button></div>`;
        container.innerHTML = html;

        // Eventlistener für Antworten
        const ansBtns = document.querySelectorAll('.answer-btn');
        ansBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(quizFinished) return;
                const selectedText = btn.getAttribute('data-answer-text');
                // Speichere antwort
                userAnswers[quizIndex] = selectedText;
                // visuell markieren
                ansBtns.forEach(b => b.style.background = "#f1f5f9");
                btn.style.background = "#b9d8ff";
                btn.style.borderColor = "#1e4a76";
            });
        });

        const nextBtn = document.getElementById("next-quiz-btn");
        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if(userAnswers[quizIndex] === null) {
                    alert(currentLang === 'de' ? "Bitte beantworte die Frage!" : "Veuillez répondre à la question!");
                    return;
                }
                if(quizIndex + 1 < currentQuizQuestions.length) {
                    quizIndex++;
                    renderCurrentQuestion();
                } else {
                    // Quiz beenden und Score anzeigen
                    quizFinished = true;
                    renderCurrentQuestion(); // zeigt score an
                }
            });
        }
    }

    function showScoreScreen() {
        // Berechne Auswertung: jede Antwort mit richtiger Antwort vergleichen
        let score = 0;
        let feedback = [];
        for(let i=0; i<currentQuizQuestions.length; i++) {
            const q = currentQuizQuestions[i];
            const userAnsText = userAnswers[i];
            // richtige Antwort als Text
            const correctText = q.answers[q.correct];
            const isCorrect = (userAnsText === correctText);
            if(isCorrect) score++;
            feedback.push({
                question: q.text,
                user: userAnsText || "(keine Antwort)",
                correct: correctText,
                isCorrect: isCorrect
            });
        }

        const container = document.getElementById("quiz-panel");
        let resultHtml = `<div class="scoreboard"><h2>📊 Score: ${score} / ${currentQuizQuestions.length}</h2>
        <p>${currentLang === 'de' ? 'Auswertung der Antworten:' : 'Résultats détaillés:'}</p></div>
        <div class="feedback-list">`;
        feedback.forEach((fb, idx) => {
            const icon = fb.isCorrect ? "✅" : "❌";
            resultHtml += `<div class="feedback-item"><strong>${idx+1}. ${fb.question}</strong><br>
            ${currentLang === 'de' ? 'Deine Antwort:' : 'Votre réponse:'} ${fb.user} <br>
            ✔ ${currentLang === 'de' ? 'Richtig:' : 'Correcte:'} ${fb.correct} ${icon}</div>`;
        });
        resultHtml += `</div><div class="quiz-footer" style="margin-top:25px;"><button id="score-restart-btn">🔄 QUIZ NEUSTART</button>
        <button id="score-home-btn">🏠 HOME</button></div>`;
        container.innerHTML = resultHtml;
        document.getElementById("score-restart-btn")?.addEventListener("click", () => restartQuiz());
        document.getElementById("score-home-btn")?.addEventListener("click", () => goToHome());
    }

    function restartQuiz() {
        // frisches quiz mit neu zufälligen Antwortreihenfolgen
        currentQuizQuestions = getCurrentQuestions();
        userAnswers.fill(null);
        quizIndex = 0;
        quizFinished = false;
        initQuizOrder();
        renderCurrentQuestion();
        const progress = document.getElementById("quiz-progress");
        if(progress) progress.innerText = `Frage 1 / ${currentQuizQuestions.length}`;
    }

    // Theorie dynamisch rendern
    function renderTheory() {
        const theoryData = currentLang === 'de' ? theoryDe : theoryFr;
        const container = document.getElementById("theory-content");
        if(!container) return;
        let html = "";
        theoryData.forEach(section => {
            html += `<div class="theory-card"><h3>${section.title}</h3><p>${section.content}</p></div>`;
        });
        container.innerHTML = html;
    }

    // QA (zwei Fragen & Antworten) Bezug Echographie
    const qaData = {
        de: [
            {frage: "Was ist der physikalische Unterschied zwischen Kompression und Rarefaktion?", antwort: "Kompression = Druckmaximum, Rarefaktion = Druckminimum; gemeinsam bilden sie eine Longitudinalwelle."},
            {frage: "Warum limitiert Luft die Ultraschalluntersuchung?", antwort: "Luft hat eine sehr niedrige Impedanz → starke Reflexion (ca. 99%), daher kaum Transmission ins Gewebe."}
        ],
        fr: [
            {frage: "Quelle est la différence entre compression et raréfaction en échographie?", reponse: "Compression: pression maximale, raréfaction: pression minimale; ensemble elles forment une onde longitudinale."},
            {frage: "Pourquoi l'air limite-t-il l'examen échographique?", reponse: "L'air a une très faible impédance → réflexion quasi totale → pas de transmission."}
        ]
    };
    function renderQA() {
        const container = document.getElementById("qa-container");
        if(!container) return;
        const data = currentLang === 'de' ? qaData.de : qaData.fr;
        let html = "";
        data.forEach(item => {
            const questionText = currentLang === 'de' ? item.frage : item.frage;
            const answerText = currentLang === 'de' ? item.antwort : item.reponse;
            html += `<div class="qa-item"><div class="qa-question">❓ ${questionText}</div><div class="qa-answer">📌 ${answerText}</div></div>`;
        });
        container.innerHTML = html;
    }

    // Navigation & Sprachwechsel & Screen Steuerung mit history stack (für Zurück)
    let screenStack = ["home"];
    function showScreen(screenId, addToStack = true) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`${screenId}-screen`).classList.add('active');
        if(addToStack && screenStack[screenStack.length-1] !== screenId) screenStack.push(screenId);
        if(screenId === "theory") renderTheory();
        if(screenId === "quiz") {
            if(!currentQuizQuestions.length || currentQuizQuestions.length !== 15 || quizFinished === true && userAnswers.every(v=>v!==null)){
                // nur bei erstem öffnen initialisieren falls nicht initialisiert
                if(currentQuizQuestions.length === 0 || quizFinished) {
                    currentQuizQuestions = getCurrentQuestions();
                    userAnswers.fill(null);
                    quizIndex = 0;
                    quizFinished = false;
                    initQuizOrder();
                    renderCurrentQuestion();
                } else {
                    renderCurrentQuestion();
                }
            } else {
                renderCurrentQuestion();
            }
        }
        if(screenId === "qa") renderQA();
    }

    function goBack() {
        if(screenStack.length > 1) {
            screenStack.pop();
            const prev = screenStack[screenStack.length-1];
            showScreen(prev, false);
        } else {
            showScreen("home", false);
        }
    }
    function goToHome() {
        while(screenStack.length > 1) screenStack.pop();
        showScreen("home", false);
    }

    // Eventlistener binden
    document.getElementById("goto-theory-home")?.addEventListener("click", ()=>showScreen("theory"));
    document.getElementById("goto-quiz-home")?.addEventListener("click", ()=>showScreen("quiz"));
    document.getElementById("goto-qa-home")?.addEventListener("click", ()=>showScreen("qa"));
    document.getElementById("theory-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("theory-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("quiz-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-restart-btn")?.addEventListener("click", ()=>{ restartQuiz(); });
    document.getElementById("qa-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("qa-back-btn")?.addEventListener("click", goBack);
    document.getElementById("lang-de")?.addEventListener("click", ()=>{ currentLang = 'de'; if(document.getElementById("home-screen").classList.contains("active")){} renderTheory(); renderQA(); if(document.getElementById("quiz-screen").classList.contains("active")){ restartQuiz(); } });
    document.getElementById("lang-fr")?.addEventListener("click", ()=>{ currentLang = 'fr'; renderTheory(); renderQA(); if(document.getElementById("quiz-screen").classList.contains("active")){ restartQuiz(); } });

    // initial
    currentQuizQuestions = getCurrentQuestions();
    userAnswers.fill(null);
    initQuizOrder();
    renderTheory();
    renderQA();
    showScreen("home", false);
</script>
</body>
</html>
