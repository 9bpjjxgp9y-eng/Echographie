<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>Echographie</h1>
  </div>

  <!-- SCREENS -->
  <div class="content">

    <!-- HOME -->
    <div id="startScreen" class="screen">
  <div class="card">
    <button id="btnTheory" onclick="showTheory()"></button>
    <button id="btnQuiz" onclick="startQuiz()"></button>
  </div>

  <div class="lang-buttons">
    <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
    <button onclick="setLanguage('fr')">🇫🇷 Français</button>
  </div>
</div> 

    <!-- THEORY -->
    <div id="theoryScreen" class="screen" style="display:none;">
      <div id="theoryMenu"></div>
    </div>

    <!-- THEORY DETAIL -->
    <div id="theoryDetailScreen" class="screen" style="display:none;"></div>

    <!-- QUIZ -->
    <div id="quizScreen" class="screen" style="display:none;">
      <div class="progress">
        <div id="progressBar"></div>
      </div>

  <div id="resultText"></div>
      <div id="answers"></div>
    </div>

    <!-- RESULT -->
    <div id="resultScreen" class="screen" style="display:none;">
      <h2 id="resultText"></h2>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="nav">
  <button onclick="goHome()">🏠</button>
  <button id="restartBtn" onclick="restartQuiz()" style="display:none;">🔄</button>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
