<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Echographie App</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon.png">
</head>

<body>

<!-- START -->
<div id="startScreen">
  <h1>Echographie App</h1>

  <button id="btnTheory" onclick="showTheory()">Theorie</button>
  <button id="btnQuiz" onclick="startQuiz()">Quiz</button>

  <div>
    <button onclick="setLanguage('de')">🇩🇪 Deutsch</button>
    <button onclick="setLanguage('fr')">🇫🇷 Français</button>
  </div>
</div>

<!-- THEORY -->
<div id="theoryScreen" style="display:none;">
  <h2 id="theoryTitle"></h2>
  <div id="theoryMenu"></div>

  <button onclick="goHome()">🏠 Home</button>
</div>

<!-- THEORY DETAIL -->
<div id="theoryDetailScreen" style="display:none;">
  <button onclick="backToTheory()">⬅ Zurück</button>

  <h2 id="detailTitle"></h2>
  <div id="detailContent"></div>
</div>

<!-- QUIZ -->
<div id="quizScreen" style="display:none;">
  <h2 id="question"></h2>
  <div id="answers"></div>

  <button onclick="goHome()">🏠 Home</button>
  <button onclick="restartQuiz()">🔄 Restart</button>
</div>

<!-- RESULT -->
<div id="resultScreen" style="display:none;">
  <h2 id="resultText"></h2>

  <button onclick="goHome()">🏠 Home</button>
  <button onclick="restartQuiz()">🔄 Restart</button>
</div>

<script src="script.js"></script>

</body>
</html>
