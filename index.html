<!DOCTYPE html>
<html lang="de">
<head:
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ultraschall LernApp - Perfekt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* App Container */
        #app {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 64px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Seiten (jede Seite ist ein screen) */
        .screen {
            display: none;
            padding: 2rem 2rem 2rem 2rem;
            animation: fadeIn 0.25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Header mit Home & Zurück */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .nav-group {
            display: flex;
            gap: 16px;
        }

        button {
            background: #1e293b;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button i { font-style: normal; font-weight: bold; font-size: 1.2rem; }

        button:active { transform: scale(0.96); background: #0f172a;}

        .btn-primary {
            background: #0f3b5c;
            box-shadow: 0 8px 18px rgba(0, 60, 90, 0.3);
        }
        .btn-primary:hover { background: #1e4a76;}

        .btn-quiz { background: #2c3e66; }
        .btn-theory { background: #2b5e3b; }
        .btn-qa { background: #9b4a1f; }

        /* Hauptmenü Buttons */
        .main-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 60px 0 50px;
        }
        .main-btn {
            flex: 1;
            min-width: 200px;
            padding: 28px 20px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 56px;
            justify-content: center;
            background: #2d3e50;
        }

        .sprache-block {
            margin-top: 50px;
            text-align: center;
            background: #eef2ff;
            padding: 20px;
            border-radius: 60px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .lang-btn {
            background: #334155;
            padding: 12px 28px;
            font-size: 1.2rem;
        }

        /* Theorie styling */
        .theory-card {
            background: #f8fafc;
            border-radius: 42px;
            padding: 1.8rem;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            border-left: 8px solid #2b5e3b;
        }
        .theory-card h3 {
            color: #1e3a2f;
            margin-bottom: 12px;
            font-size: 1.6rem;
        }
        .theory-card p {
            line-height: 1.5;
            color: #1e293b;
            font-size: 1rem;
        }

        /* Quiz */
        .quiz-question {
            font-size: 1.7rem;
            font-weight: 700;
            background: #eef2ff;
            padding: 24px;
            border-radius: 48px;
            margin-bottom: 32px;
        }
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .answer-btn {
            background: white;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            justify-content: flex-start;
            text-align: left;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: none;
        }
        .answer-btn:hover:not(:disabled) {
            background: #d9e6f5;
            border-color: #2c3e66;
        }
        .disabled-ans {
            opacity: 0.7;
            pointer-events: none;
        }
        .quiz-footer {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .scoreboard {
            background: #1e293b;
            color: white;
            border-radius: 60px;
            padding: 28px;
            margin-top: 20px;
        }
        .feedback-list {
            margin-top: 24px;
            background: #ffffffdb;
            padding: 20px;
            border-radius: 38px;
        }
        .feedback-item {
            border-bottom: 1px solid #ccc;
            padding: 12px;
            font-size: 0.95rem;
        }

        /* QA Bereich */
        .qa-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .qa-item {
            background: #fff7ed;
            border-radius: 48px;
            padding: 28px;
            border: 1px solid #fed7aa;
        }
        .qa-question {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 16px;
            color: #9b4a1f;
        }
        .qa-answer {
            font-size: 1.2rem;
            background: white;
            padding: 18px;
            border-radius: 40px;
            color: #2d3e50;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72, #2b5876);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        @media (max-width: 680px) {
            .screen { padding: 1.2rem; }
            .main-btn { font-size: 1.3rem; padding: 18px; }
            .quiz-question { font-size: 1.3rem; }
        }
        hr {
            margin: 15px 0;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ============================================= -->
    <!-- HOMESCREEN (Start) -->
    <!-- ============================================= -->
    <div id="home-screen" class="screen active">
        <div style="text-align: center; margin-top: 20px;">
            <h1 id="home-title">📘 SonoMaster</h1>
            <p id="home-subtitle" style="font-size: 1.2rem; margin-bottom: 15px;">Echographie – Lernen mit System</p>
        </div>
        <div class="main-buttons">
            <button class="main-btn btn-theory" id="goto-theory-home">📖 THEORIE</button>
            <button class="main-btn btn-quiz" id="goto-quiz-home">❓ QUIZ</button>
            <button class="main-btn btn-qa" id="goto-qa-home">💬 FRAGE & ANTWORT</button>
        </div>
        <div class="sprache-block">
            <span style="font-weight: 500; align-self: center;" id="lang-label">🌐 Sprache / Langue :</span>
            <button class="lang-btn" id="lang-de">DEUTSCH</button>
            <button class="lang-btn" id="lang-fr">FRANÇAIS</button>
        </div>
        <div style="text-align: center; margin-top: 30px; opacity: 0.7; font-size: 0.8rem;" id="home-footer">
            ⬅️ Navigation: Home & Zurück jederzeit verfügbar
        </div>
    </div>

    <!-- ============================================= -->
    <!-- THEORIE SEITE (umfangreiche texte) -->
    <!-- ============================================= -->
    <div id="theory-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="theory-home-btn">🏠 HOME</button>
                <button id="theory-back-btn">◀ ZURÜCK</button>
            </div>
            <div><span style="font-weight: bold;" id="theory-header-label">📖 Theorie-Kapitel</span></div>
        </div>
        <div id="theory-content"></div>
    </div>

    <!-- ============================================= -->
    <!-- QUIZ SEITE (15 Fragen, zufällige Antwortreihenfolge, Restart, Score) -->
    <!-- ============================================= -->
    <div id="quiz-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="quiz-home-btn">🏠 HOME</button>
                <button id="quiz-back-btn">◀ ZURÜCK</button>
                <button id="quiz-restart-btn">🔄 RESTART</button>
            </div>
            <div><span id="quiz-progress">Frage 1 / 15</span></div>
        </div>
        <div id="quiz-panel">
            <!-- dynamisch: frage + antworten -->
        </div>
    </div>

    <!-- ============================================= -->
    <!-- FRAGE & ANTWORT SEITE (QA) -->
    <!-- ============================================= -->
    <div id="qa-screen" class="screen">
        <div class="nav-bar">
            <div class="nav-group">
                <button id="qa-home-btn">🏠 HOME</button>
                <button id="qa-back-btn">◀ ZURÜCK</button>
            </div>
            <div id="qa-header-label">❓ Q&A Bereich</div>
        </div>
        <div class="qa-container" id="qa-container"></div>
    </div>

</div>

<script>
    // ---------- Sprachtexte für die gesamte App: Home, Theorie, QA, UI ----------
    let currentLang = 'de';   // 'de' oder 'fr'

    // ===================== THEORIE TEXTE (DEINE EXAKTEN VORGABEN) =====================
    const theoryChapters = [
        { // 1. Einführung
            de: { title: "📘 Einführung", text: "Echographie ist eine sichere Echtzeit-Ultraschallmethode zur medizinischen Bildgebung. Sie arbeitet ohne ionisierende Strahlung und nutzt Reflexionen von Schallwellen, um innere Strukturen sichtbar zu machen. Besonders wichtig ist sie, weil sie nicht invasiv ist, keine Schmerzen verursacht und sofort Ergebnisse liefert. Ärzte können damit Organe in Bewegung beobachten, etwa das Herz oder ein ungeborenes Kind. Dadurch ist sie ein zentrales Werkzeug in der modernen Diagnostik." },
            fr: { title: "📘 Introduction", text: "L'échographie est une méthode d'imagerie en temps réel utilisant les ultrasons. Elle est non invasive, sans radiation ionisante et permet d'observer les structures internes du corps. Elle est essentielle en médecine moderne car elle fournit des résultats immédiats et permet d'analyser le mouvement des organes comme le cœur ou le fœtus." }
        },
        { // 2. Ultraschall
            de: { title: "🌊 Ultraschall", text: "Ultraschall sind mechanische Schallwellen mit Frequenzen über 20 kHz. In der Medizin werden meist 1–15 MHz verwendet, um eine hohe Bildauflösung zu erreichen. Die Wellen breiten sich longitudinal aus und werden unterschiedlich stark an Gewebegrenzen reflektiert. Dadurch entstehen die Bilder in der Echographie." },
            fr: { title: "🌊 Ultrasons", text: "Les ultrasons sont des ondes mécaniques de fréquence supérieure à 20 kHz. En médecine, on utilise souvent 1 à 15 MHz pour obtenir une bonne résolution. Ils se propagent de manière longitudinale et sont réfléchis différemment selon les tissus, ce qui permet de créer les images." }
        },
        { // 3. Kompression & Rarefaktion
            de: { title: "🔊 Kompression & Rarefaktion", text: "Eine Ultraschallwelle besteht aus abwechselnden Zonen von Kompression und Rarefaktion. Bei der Kompression werden Teilchen zusammengedrückt, bei der Rarefaktion wieder auseinandergezogen. Dieser Wechsel erzeugt die Druckschwankungen, die vom Gerät gemessen werden und die Bildinformation liefern." },
            fr: { title: "🔊 Compression & raréfaction", text: "Une onde ultrasonore est composée d'alternances de compression et de raréfaction. Les particules sont comprimées puis relâchées. Ces variations de pression sont détectées par la sonde et permettent de créer l'image." }
        },
        { // 4. Typen der Echographie
            de: { title: "🖥️ Typen der Echographie", text: "2D zeigt Schnittbilder, 3D erzeugt räumliche Rekonstruktionen und 4D zeigt Bewegungen in Echtzeit. Der Doppler misst zusätzlich den Blutfluss durch den Doppler-Effekt. In der Kardiologie analysiert man Herzklappen, in der Abdominaldiagnostik Organe und in der Schwangerschaft die Entwicklung des Fötus." },
            fr: { title: "🖥️ Types d'échographie", text: "La 2D montre des coupes, la 3D reconstruit des volumes et la 4D montre le mouvement en temps réel. Le Doppler mesure le flux sanguin grâce à l'effet Doppler. Il est utilisé en cardiologie, en imagerie abdominale et en obstétrique." }
        },
        { // 5. Fazit
            de: { title: "🎯 Fazit", text: "Die Echographie ist eine der wichtigsten Methoden der modernen Medizin. Sie ist sicher, schnell und vielseitig einsetzbar. Trotz ihrer Abhängigkeit vom Bediener bleibt sie unverzichtbar für Diagnose und Überwachung." },
            fr: { title: "🎯 Conclusion", text: "L'échographie est une technique essentielle en médecine moderne. Elle est rapide, sûre et très polyvalente, malgré une dépendance à l'opérateur." }
        }
    ];

    // Texts for the UI elements (Home and navigation bits)
    const homeTexts = {
        de: { title: "📘 SonoMaster", subtitle: "Echographie – Lernen mit System", theorieBtn: "📖 THEORIE", quizBtn: "❓ QUIZ", qaBtn: "💬 FRAGE & ANTWORT", langLabel: "🌐 Sprache / Langue :", footer: "⬅️ Navigation: Home & Zurück jederzeit verfügbar" },
        fr: { title: "📘 SonoMaster", subtitle: "Échographie – Apprendre systématiquement", theorieBtn: "📖 THÉORIE", quizBtn: "❓ QUIZ", qaBtn: "💬 QUESTIONS & RÉPONSES", langLabel: "🌐 Langue :", footer: "⬅️ Navigation: Accueil & Retour toujours disponibles" }
    };

    // QA Texte (zwei Fragen/Antworten zu Echographie)
    const qaData = {
        de: [
            { frage: "Was ist der physikalische Unterschied zwischen Kompression und Rarefaktion?", antwort: "Kompression = Druckmaximum, Rarefaktion = Druckminimum; gemeinsam bilden sie eine Longitudinalwelle. Die Kompression schiebt Teilchen zusammen, die Rarefaktion zieht sie auseinander – das ist der Mechanismus der Wellenausbreitung." },
            { frage: "Warum limitiert Luft die Ultraschalluntersuchung?", antwort: "Luft hat eine sehr niedrige akustische Impedanz im Vergleich zu Gewebe. Das führt zu einer extrem starken Reflexion (ca. 99 % der Schallenergie), sodass kaum Ultraschall ins Gewebe eindringt und kein brauchbares Bild entsteht." }
        ],
        fr: [
            { frage: "Quelle est la différence physique entre compression et raréfaction en échographie?", reponse: "Compression = pression maximale, raréfaction = pression minimale ; ensemble elles forment une onde longitudinale. La compression rapproche les particules, la raréfaction les écarte – c'est le mécanisme de propagation des ondes." },
            { frage: "Pourquoi l'air limite-t-il l'examen échographique?", reponse: "L'air a une impédance acoustique très faible par rapport aux tissus. Cela provoque une réflexion extrêmement forte (environ 99 % de l'énergie ultrasonore), empêchant la pénétration des ondes et la formation d'une image exploitable." }
        ]
    };

    // ----- 15 Quizfragen (vier Antworten, immer zufällige Reihenfolge zur Laufzeit) -----
    const quizQuestions = {
        de: [
            { text: "Welche Frequenzbereiche werden typisch für Abdomensonographie genutzt?", answers: ["2-5 MHz", "10-15 MHz", "20-30 MHz", "<1 MHz"], correct: 0 },
            { text: "Was bedeutet Hyperechogen?", answers: ["dunkel / schwarz", "hell / starke Reflexion", "schallfrei", "schwach reflektierend"], correct: 1 },
            { text: "Akustische Impedanz ist abhängig von:", answers: ["Dichte & Schallgeschwindigkeit", "nur der Dichte", "Frequenz", "Amplitude"], correct: 0 },
            { text: "Welche Schallkopfart eignet sich für Schilddrüsenuntersuchungen?", answers: ["Linear", "Konvex", "Phased Array", "Sektor"], correct: 0 },
            { text: "Was versteht man unter Rarefaktion?", answers: ["Verdichtung", "Druckabnahme / Ausdehnung", "Reflexion", "Absorption"], correct: 1 },
            { text: "Welcher Effekt ermöglicht die Blutflussdarstellung?", answers: ["Doppler-Effekt", "Kompressions-Effekt", "Rayleigh Streuung", "Kavitation"], correct: 0 },
            { text: "Echographie ist besonders gut geeignet für:", answers: ["Knochen", "Lunge (belüftet)", "Weichteile / Parenchym", "Dickdarm mit Luft"], correct: 2 },
            { text: "Was bedeutet Anechogen?", answers: ["keine Echos (flüssigkeitsgefüllt)", "sehr hell", "gemischt", "niedrige Frequenz"], correct: 0 },
            { text: "Die Auflösung wird mit höherer Frequenz ...", answers: ["besser", "schlechter", "unverändert", "unberechenbar"], correct: 0 },
            { text: "Welches Medium lässt Ultraschall kaum passieren?", answers: ["Luft", "Wasser", "Weichteil", "Muskel"], correct: 0 },
            { text: "Was misst die Elastographie?", answers: ["Gewebesteifigkeit", "Flussgeschwindigkeit", "Temperatur", "Dichte"], correct: 0 },
            { text: "Wie nennt man die Rauschunterdrückung im Bild?", answers: ["Compound", "Harmonic Imaging", "Gain", "Tiefenausgleich"], correct: 1 },
            { text: "Welche Art von Welle ist Ultraschall?", answers: ["Longitudinalwelle", "Transversalwelle", "Oberflächenwelle", "elektromagnetisch"], correct: 0 },
            { text: "Für Schwangerschaftsuntersuchungen wird Frequenz meist zwischen:", answers: ["3-7 MHz", "12-18 MHz", "20 MHz", "<1 MHz"], correct: 0 },
            { text: "Was ist die Rolle des Gels?", answers: ["Luftausschluss / Impedanzanpassung", "Kühlung", "Schalldämpfung", "Fokussierung"], correct: 0 }
        ],
        fr: [
            { text: "Plage de fréquences typique pour l'échographie abdominale ?", answers: ["2-5 MHz", "10-15 MHz", "20-30 MHz", "<1 MHz"], correct: 0 },
            { text: "Que signifie hyperéchogène ?", answers: ["foncé / noir", "brillant / forte réflexion", "anéchogène", "faible réflexion"], correct: 1 },
            { text: "L'impédance acoustique dépend de :", answers: ["densité & vitesse du son", "densité uniquement", "fréquence", "amplitude"], correct: 0 },
            { text: "Quel type de sonde pour la thyroïde ?", answers: ["Linéaire", "Convexe", "Phased-array", "Sectoriel"], correct: 0 },
            { text: "Qu'est-ce que la raréfaction ?", answers: ["Compression", "Diminution de pression", "Réflexion", "Absorption"], correct: 1 },
            { text: "Quel effet permet d'imager le flux sanguin ?", answers: ["Doppler", "Compression", "Rayleigh", "Cavitation"], correct: 0 },
            { text: "L'échographie est adaptée pour :", answers: ["Os", "Poumon aéré", "Tissus mous", "Colon rempli d'air"], correct: 2 },
            { text: "Anéchogène signifie :", answers: ["sans écho (liquide)", "très brillant", "mixte", "basse fréquence"], correct: 0 },
            { text: "La résolution avec une fréquence plus élevée devient :", answers: ["meilleure", "pire", "identique", "instable"], correct: 0 },
            { text: "Quel milieu bloque presque les ultrasons ?", answers: ["Air", "Eau", "Tissus mous", "Muscle"], correct: 0 },
            { text: "Que mesure l'élastographie ?", answers: ["Dureté tissulaire", "Vitesse sanguine", "Température", "Densité"], correct: 0 },
            { text: "Nom d'une technique de réduction d'artefacts ?", answers: ["Compound", "Harmonic Imaging", "Gain", "TGC"], correct: 1 },
            { text: "Type d'onde ultrasonore :", answers: ["Longitudinale", "Transversale", "Ondes de surface", "Électromagnétique"], correct: 0 },
            { text: "Échographie obstétricale utilise généralement :", answers: ["3-7 MHz", "12-18 MHz", "20 MHz", "<1 MHz"], correct: 0 },
            { text: "Rôle du gel échographique :", answers: ["Éviter l'air / adaptation d'impédance", "Refroidir", "Atténuer", "Focaliser"], correct: 0 }
        ]
    };

    function getCurrentQuizBank() {
        return currentLang === 'de' ? [...quizQuestions.de] : [...quizQuestions.fr];
    }

    // Globale Quiz-Zustände
    let currentQuizQuestions = [];
    let quizIndex = 0;
    let userAnswers = new Array(15).fill(null);
    let quizFinished = false;
    let currentAnswersOrder = [];

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuizOrder() {
        const qCount = currentQuizQuestions.length;
        currentAnswersOrder = [];
        for (let i = 0; i < qCount; i++) {
            let indices = [0,1,2,3];
            shuffleArray(indices);
            currentAnswersOrder.push(indices);
        }
    }

    function renderCurrentQuestion() {
        const container = document.getElementById("quiz-panel");
        if (!container) return;
        if (quizFinished) {
            showScoreScreen();
            return;
        }
        const q = currentQuizQuestions[quizIndex];
        const order = currentAnswersOrder[quizIndex];
        const shuffledAnswers = order.map(idx => q.answers[idx]);
        const progressSpan = document.getElementById("quiz-progress");
        if(progressSpan) progressSpan.innerText = `${currentLang === 'de' ? 'Frage' : 'Question'} ${quizIndex+1} / ${currentQuizQuestions.length}`;

        let html = `<div class="quiz-question">${quizIndex+1}. ${q.text}</div>`;
        html += `<div class="answers-grid" id="answers-grid">`;
        shuffledAnswers.forEach((ans, idx) => {
            html += `<button class="answer-btn" data-answer-idx="${idx}" data-answer-text="${ans.replace(/"/g, '&quot;')}">${ans}</button>`;
        });
        html += `</div><div class="quiz-footer"><button id="next-quiz-btn" style="background:#2c3e66;">${currentLang === 'de' ? '➡ Nächste Frage' : '➡ Question suivante'}</button></div>`;
        container.innerHTML = html;

        const ansBtns = document.querySelectorAll('.answer-btn');
        ansBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(quizFinished) return;
                const selectedText = btn.getAttribute('data-answer-text');
                userAnswers[quizIndex] = selectedText;
                ansBtns.forEach(b => b.style.background = "#f1f5f9");
                btn.style.background = "#b9d8ff";
                btn.style.borderColor = "#1e4a76";
            });
        });

        const nextBtn = document.getElementById("next-quiz-btn");
        if(nextBtn) {
            nextBtn.addEventListener('click', () => {
                if(userAnswers[quizIndex] === null) {
                    alert(currentLang === 'de' ? "Bitte beantworte die Frage!" : "Veuillez répondre à la question!");
                    return;
                }
                if(quizIndex + 1 < currentQuizQuestions.length) {
                    quizIndex++;
                    renderCurrentQuestion();
                } else {
                    quizFinished = true;
                    renderCurrentQuestion();
                }
            });
        }
    }

    function showScoreScreen() {
        let score = 0;
        let feedback = [];
        for(let i=0; i<currentQuizQuestions.length; i++) {
            const q = currentQuizQuestions[i];
            const userAnsText = userAnswers[i];
            const correctText = q.answers[q.correct];
            const isCorrect = (userAnsText === correctText);
            if(isCorrect) score++;
            feedback.push({
                question: q.text,
                user: userAnsText || (currentLang === 'de' ? "(keine Antwort)" : "(pas de réponse)"),
                correct: correctText,
                isCorrect: isCorrect
            });
        }

        const container = document.getElementById("quiz-panel");
        let resultHtml = `<div class="scoreboard"><h2>📊 Score: ${score} / ${currentQuizQuestions.length}</h2>
        <p>${currentLang === 'de' ? 'Auswertung der Antworten:' : 'Résultats détaillés:'}</p></div>
        <div class="feedback-list">`;
        feedback.forEach((fb, idx) => {
            const icon = fb.isCorrect ? "✅" : "❌";
            resultHtml += `<div class="feedback-item"><strong>${idx+1}. ${fb.question}</strong><br>
            ${currentLang === 'de' ? 'Deine Antwort:' : 'Votre réponse:'} ${fb.user} <br>
            ✔ ${currentLang === 'de' ? 'Richtig:' : 'Correcte:'} ${fb.correct} ${icon}</div>`;
        });
        resultHtml += `</div><div class="quiz-footer" style="margin-top:25px;"><button id="score-restart-btn">🔄 ${currentLang === 'de' ? 'QUIZ NEUSTART' : 'RECOMMENCER'}</button>
        <button id="score-home-btn">🏠 ${currentLang === 'de' ? 'HOME' : 'ACCUEIL'}</button></div>`;
        container.innerHTML = resultHtml;
        document.getElementById("score-restart-btn")?.addEventListener("click", () => restartQuiz());
        document.getElementById("score-home-btn")?.addEventListener("click", () => goToHome());
    }

    function restartQuiz() {
        currentQuizQuestions = getCurrentQuizBank();
        userAnswers.fill(null);
        quizIndex = 0;
        quizFinished = false;
        initQuizOrder();
        renderCurrentQuestion();
        const progress = document.getElementById("quiz-progress");
        if(progress) progress.innerText = `${currentLang === 'de' ? 'Frage' : 'Question'} 1 / ${currentQuizQuestions.length}`;
    }

    // Theorie rendern (exakt deine Texte)
    function renderTheory() {
        const container = document.getElementById("theory-content");
        if(!container) return;
        let html = "";
        theoryChapters.forEach(ch => {
            const data = currentLang === 'de' ? ch.de : ch.fr;
            html += `<div class="theory-card"><h3>${data.title}</h3><p>${data.text}</p></div>`;
        });
        container.innerHTML = html;
        const headerLabel = document.getElementById("theory-header-label");
        if(headerLabel) headerLabel.innerText = currentLang === 'de' ? "📖 Theorie-Kapitel" : "📖 Chapitres de théorie";
    }

    // QA rendern
    function renderQA() {
        const container = document.getElementById("qa-container");
        if(!container) return;
        const data = currentLang === 'de' ? qaData.de : qaData.fr;
        let html = "";
        data.forEach(item => {
            const questionText = currentLang === 'de' ? item.frage : item.frage;
            const answerText = currentLang === 'de' ? item.antwort : item.reponse;
            html += `<div class="qa-item"><div class="qa-question">❓ ${questionText}</div><div class="qa-answer">📌 ${answerText}</div></div>`;
        });
        container.innerHTML = html;
        const qaHeader = document.getElementById("qa-header-label");
        if(qaHeader) qaHeader.innerText = currentLang === 'de' ? "❓ Q&A Bereich" : "❓ Section Questions/Réponses";
    }

    // Home Texte übersetzen
    function updateHomeTexts() {
        const texts = homeTexts[currentLang];
        document.getElementById("home-title").innerText = texts.title;
        document.getElementById("home-subtitle").innerText = texts.subtitle;
        document.getElementById("goto-theory-home").innerHTML = texts.theorieBtn;
        document.getElementById("goto-quiz-home").innerHTML = texts.quizBtn;
        document.getElementById("goto-qa-home").innerHTML = texts.qaBtn;
        document.getElementById("lang-label").innerHTML = texts.langLabel;
        document.getElementById("home-footer").innerHTML = texts.footer;
    }

    // Sprachumschaltung komplett
    function setLanguage(lang) {
        currentLang = lang;
        updateHomeTexts();
        renderTheory();
        renderQA();
        // Wenn Quiz gerade offen ist, Neustart mit frischen Fragen
        const quizScreen = document.getElementById("quiz-screen");
        if(quizScreen.classList.contains("active")) {
            currentQuizQuestions = getCurrentQuizBank();
            userAnswers.fill(null);
            quizIndex = 0;
            quizFinished = false;
            initQuizOrder();
            renderCurrentQuestion();
        }
    }

    // Navigation & history stack
    let screenStack = ["home"];
    function showScreen(screenId, addToStack = true) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`${screenId}-screen`).classList.add('active');
        if(addToStack && screenStack[screenStack.length-1] !== screenId) screenStack.push(screenId);
        if(screenId === "theory") renderTheory();
        if(screenId === "quiz") {
            if(!currentQuizQuestions.length || currentQuizQuestions.length !== 15 || quizFinished) {
                currentQuizQuestions = getCurrentQuizBank();
                userAnswers.fill(null);
                quizIndex = 0;
                quizFinished = false;
                initQuizOrder();
                renderCurrentQuestion();
            } else {
                renderCurrentQuestion();
            }
        }
        if(screenId === "qa") renderQA();
    }

    function goBack() {
        if(screenStack.length > 1) {
            screenStack.pop();
            const prev = screenStack[screenStack.length-1];
            showScreen(prev, false);
        } else {
            showScreen("home", false);
        }
    }
    function goToHome() {
        while(screenStack.length > 1) screenStack.pop();
        showScreen("home", false);
    }

    // Event Listener
    document.getElementById("goto-theory-home")?.addEventListener("click", ()=>showScreen("theory"));
    document.getElementById("goto-quiz-home")?.addEventListener("click", ()=>showScreen("quiz"));
    document.getElementById("goto-qa-home")?.addEventListener("click", ()=>showScreen("qa"));
    document.getElementById("theory-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("theory-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("quiz-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-restart-btn")?.addEventListener("click", ()=>{ restartQuiz(); });
    document.getElementById("qa-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("qa-back-btn")?.addEventListener("click", goBack);
    document.getElementById("lang-de")?.addEventListener("click", ()=>{ setLanguage('de'); });
    document.getElementById("lang-fr")?.addEventListener("click", ()=>{ setLanguage('fr'); });

    // Initialisierung
    currentQuizQuestions = getCurrentQuizBank();
    initQuizOrder();
    updateHomeTexts();
    renderTheory();
    renderQA();
    showScreen("home", false);
</script>
</body>
</html>
