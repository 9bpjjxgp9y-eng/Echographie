<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 64px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .screen {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.25s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .nav-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            background: #1e293b;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:active { transform: scale(0.96); background: #0f172a;}

        .btn-primary { background: #0f3b5c; }
        .btn-quiz { background: #2c3e66; }
        .btn-theory { background: #2b5e3b; }
        .btn-qa { background: #9b4a1f; }
        .btn-history { background: #6b21a5; }

        .main-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 40px 0 30px;
        }
        .main-btn {
            flex: 1;
            min-width: 180px;
            padding: 24px 16px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 48px;
            justify-content: center;
        }

        .sprache-block {
            margin-top: 40px;
            text-align: center;
            background: #eef2ff;
            padding: 20px;
            border-radius: 60px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .theory-card {
            background: #f8fafc;
            border-radius: 42px;
            padding: 1.8rem;
            margin-bottom: 24px;
            border-left: 8px solid #2b5e3b;
        }
        .theory-card h3 { color: #1e3a2f; margin-bottom: 12px; font-size: 1.5rem; }
        .theory-card p { line-height: 1.5; color: #1e293b; }

        .quiz-question {
            font-size: 1.5rem;
            font-weight: 700;
            background: #eef2ff;
            padding: 24px;
            border-radius: 48px;
            margin-bottom: 24px;
        }
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }
        .answer-btn {
            background: white;
            border: 2px solid #cbd5e1;
            color: #0f172a;
            justify-content: flex-start;
            text-align: left;
            padding: 14px 20px;
            border-radius: 50px;
        }
        .answer-btn.selected { background: #b9d8ff; border-color: #1e4a76; }

        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 30px;
            height: 12px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: #2b5e3b;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 30px;
        }

        .fill-blank-input {
            width: 200px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 50px;
            margin: 10px 0;
        }
        .difficulty-buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            justify-content: center;
        }
        .difficulty-btn { background: #475569; padding: 8px 20px; font-size: 0.9rem; }
        .difficulty-btn.active { background: #2b5e3b; }

        .scoreboard {
            background: #1e293b;
            color: white;
            border-radius: 48px;
            padding: 28px;
            margin-top: 20px;
        }
        .feedback-list { margin-top: 24px; background: #f1f5f9; padding: 20px; border-radius: 32px; }
        .feedback-item { border-bottom: 1px solid #ccc; padding: 12px; }

        .qa-container { display: flex; flex-direction: column; gap: 32px; }
        .qa-item { background: #fff7ed; border-radius: 48px; padding: 28px; }
        .qa-question { font-size: 1.4rem; font-weight: bold; margin-bottom: 16px; color: #9b4a1f; }
        .qa-answer { font-size: 1.1rem; background: white; padding: 18px; border-radius: 40px; }

        h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #1e3c72, #2b5876); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        @media (max-width: 680px) {
            .screen { padding: 1.2rem; }
            .quiz-question { font-size: 1.2rem; }
        }
    </style>
</head>

        if (mcFinished) { showMCScore(); return; }
        const q = currentMcQuestions[mcIndex];
        document.getElementById("quiz-progress").innerText = `${currentLang === 'de' ? 'Frage' : 'Question'} ${mcIndex+1}/${currentMcQuestions.length}`;
        const progress = ((mcIndex) / currentMcQuestions.length) * 100;
        document.getElementById("quiz-progress-bar").style.width = `${progress}%`;
        
        let html = `<div class="quiz-question">${mcIndex+1}. ${q.q}</div><div class="answers-grid">`;
        q.o.forEach((opt, idx) => {
            const isSelected = (mcAnswers[mcIndex] === idx);
            html += `<button class="answer-btn ${isSelected ? 'selected' : ''}" data-ans="${idx}">${opt}</button>`;
        });
        html += `</div><div class="quiz-footer"><button id="next-mc-btn">${currentLang === 'de' ? 'Nächste Frage' : 'Question suivante'}</button></div>`;
        container.innerHTML = html;
        document.querySelectorAll(".answer-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const ans = parseInt(btn.dataset.ans);
                mcAnswers[mcIndex] = ans;
                renderMCQuestion();
            });
        });
        document.getElementById("next-mc-btn")?.addEventListener("click", () => {
            if (mcAnswers[mcIndex] === null) { alert(currentLang === 'de' ? "Bitte antworten!" : "Veuillez répondre!"); return; }
            if (mcIndex + 1 < currentMcQuestions.length) { mcIndex++; renderMCQuestion(); }
            else { mcFinished = true; renderMCQuestion(); }
        });
    }

    function showMCScore() {
        let score = 0, feedback = [];
        for (let i = 0; i < currentMcQuestions.length; i++) {
            const isCorrect = (mcAnswers[i] === currentMcQuestions[i].correct);
            if (isCorrect) score++;
            feedback.push({ q: currentMcQuestions[i].q, user: currentMcQuestions[i].o[mcAnswers[i]], correct: currentMcQuestions[i].o[currentMcQuestions[i].correct], correctBool: isCorrect });
        }
        const container = document.getElementById("quiz-panel");
        let html = `<div class="scoreboard"><h2>Score: ${score}/${currentMcQuestions.length}</h2></div><div class="feedback-list">`;
        feedback.forEach(f => { html += `<div class="feedback-item">${f.q}<br>${currentLang === 'de' ? 'Deine Antwort:' : 'Votre réponse:'} ${f.user} | ✔ ${f.correct} ${f.correctBool ? '✅' : '❌'}</div>`; });
        html += `</div><button id="mc-restart-btn">🔄 ${currentLang === 'de' ? 'Neustart' : 'Recommencer'}</button>`;
        container.innerHTML = html;
        document.getElementById("mc-restart-btn")?.addEventListener("click", () => initMC());
    }

    function initFillBlank() {
        fbQuestions = [...fillBlankQuestions[currentLang][currentDifficulty]];
        fbAnswers = new Array(fbQuestions.length).fill("");
        fbIndex = 0;
        fbFinished = false;
        renderFillBlank();
    }

    function renderFillBlank() {
        const container = document.getElementById("fillblank-panel");
        if (fbFinished) { showFBScore(); return; }
        const q = fbQuestions[fbIndex];
        const progress = ((fbIndex) / fbQuestions.length) * 100;
        document.getElementById("fb-progress-bar").style.width = `${progress}%`;
        document.getElementById("fb-difficulty-label").innerText = `${currentLang === 'de' ? 'Schwierigkeit' : 'Difficulté'}: ${currentDifficulty === 'easy' ? (currentLang === 'de' ? 'Leicht' : 'Facile') : currentDifficulty === 'medium' ? (currentLang === 'de' ? 'Mittel' : 'Moyen') : (currentLang === 'de' ? 'Schwer' : 'Difficile')}`;
        
        let html = `<div class="quiz-question">${fbIndex+1}. ${q.text.replace("_____", `<input type="text" id="fb-input" class="fill-blank-input" placeholder="${currentLang === 'de' ? 'Antwort' : 'Réponse'}" value="${fbAnswers[fbIndex]}">`)}</div>`;
        html += `<div class="quiz-footer"><button id="check-fb-btn">${currentLang === 'de' ? 'Prüfen & Weiter' : 'Vérifier & Continuer'}</button></div>`;
        container.innerHTML = html;
        document.getElementById("check-fb-btn")?.addEventListener("click", () => {
            const input = document.getElementById("fb-input");
            const userAnswer = input.value.trim().toLowerCase();
            const correctAnswer = q.answer.toLowerCase();
            if (userAnswer === correctAnswer || (correctAnswer.includes(userAnswer) && userAnswer.length > 2) || userAnswer === correctAnswer) {
                fbAnswers[fbIndex] = input.value;
                if (fbIndex + 1 < fbQuestions.length) { fbIndex++; renderFillBlank(); }
                else { fbFinished = true; renderFillBlank(); }
            } else { alert(currentLang === 'de' ? `Falsch! Richtige Antwort: ${q.answer}` : `Incorrect! Réponse correcte: ${q.answer}`); }
        });
    }

    function showFBScore() {
        let correctCount = 0;
        fbQuestions.forEach((q, i) => { if (fbAnswers[i].toLowerCase() === q.answer.toLowerCase()) correctCount++; });
        const container = document.getElementById("fillblank-panel");
        let html = `<div class="scoreboard"><h2>${currentLang === 'de' ? 'Ergebnis' : 'Résultat'}: ${correctCount}/${fbQuestions.length}</h2></div><div class="feedback-list">`;
        fbQuestions.forEach((q, i) => { html += `<div class="feedback-item">${q.text}<br>${currentLang === 'de' ? 'Deine Antwort:' : 'Votre réponse:'} ${fbAnswers[i] || "—"} | ✔ ${q.answer}</div>`; });
        html += `</div><button id="fb-restart-btn">🔄 ${currentLang === 'de' ? 'Neustart' : 'Recommencer'}</button>`;
        container.innerHTML = html;
        document.getElementById("fb-restart-btn")?.addEventListener("click", () => initFillBlank());
    }

    function renderTheory() {
        const container = document.getElementById("theory-content");
        let html = "";
        theoryChapters.forEach(ch => { const data = ch[currentLang]; html += `<div class="theory-card"><h3>${data.title}</h3><p>${data.text}</p></div>`; });
        container.innerHTML = html;
    }

    function renderQA() {
        const container = document.getElementById("qa-container");
        let html = "";
        qaData[currentLang].forEach(item => { html += `<div class="qa-item"><div class="qa-question">❓ ${item.q}</div><div class="qa-answer">📌 ${item.a}</div></div>`; });
        container.innerHTML = html;
    }

    function renderHistory() {
        document.getElementById("history-content").innerHTML = historyTexts[currentLang];
    }

    function updateHomeTexts() {
        document.getElementById("home-title").innerText = currentLang === 'de' ? "📘 SonoMaster" : "📘 SonoMaster";
        document.getElementById("home-subtitle").innerText = currentLang === 'de' ? "Echographie – Lernen mit System" : "Échographie – Apprendre systématiquement";
        document.getElementById("lang-label").innerHTML = currentLang === 'de' ? "🌐 Sprache / Langue :" : "🌐 Langue :";
        document.getElementById("goto-theory-home").innerHTML = currentLang === 'de' ? "📖 THEORIE" : "📖 THÉORIE";
        document.getElementById("goto-quiz-home").innerHTML = currentLang === 'de' ? "❓ QUIZ MC" : "❓ QUIZ MC";
        document.getElementById("goto-fillblank-home").innerHTML = currentLang === 'de' ? "✏️ LÜCKENTEXT" : "✏️ TEXTE À TROUS";
        document.getElementById("goto-qa-home").innerHTML = currentLang === 'de' ? "💬 Q&A" : "💬 Q&R";
        document.getElementById("goto-history-home").innerHTML = currentLang === 'de' ? "📜 GESCHICHTE" : "📜 HISTOIRE";
    }

    function setLanguage(lang) {
        currentLang = lang;
        updateHomeTexts();
        renderTheory();
        renderQA();
        renderHistory();
        if (document.getElementById("quiz-screen").classList.contains("active")) initMC();
        if (document.getElementById("fillblank-screen").classList.contains("active")) initFillBlank();
    }

    function showScreen(screenId, addToStack = true) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`${screenId}-screen`).classList.add('active');
        if (addToStack && screenStack[screenStack.length-1] !== screenId) screenStack.push(screenId);
        if (screenId === "theory") renderTheory();
        if (screenId === "quiz") { if (!currentMcQuestions.length) initMC(); else renderMCQuestion(); }
        if (screenId === "fillblank") initFillBlank();
        if (screenId === "qa") renderQA();
        if (screenId === "history") renderHistory();
    }

    function goBack() {
        if (screenStack.length > 1) { screenStack.pop(); showScreen(screenStack[screenStack.length-1], false); }
        else showScreen("home", false);
    }
    function goToHome() { while (screenStack.length > 1) screenStack.pop(); showScreen("home", false); }

    // Event Listeners
    document.getElementById("goto-theory-home")?.addEventListener("click", () => showScreen("theory"));
    document.getElementById("goto-quiz-home")?.addEventListener("click", () => showScreen("quiz"));
    document.getElementById("goto-fillblank-home")?.addEventListener("click", () => showScreen("fillblank"));
    document.getElementById("goto-qa-home")?.addEventListener("click", () => showScreen("qa"));
    document.getElementById("goto-history-home")?.addEventListener("click", () => showScreen("history"));
    document.getElementById("theory-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("theory-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("quiz-back-btn")?.addEventListener("click", goBack);
    document.getElementById("quiz-restart-btn")?.addEventListener("click", initMC);
    document.getElementById("fillblank-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("fillblank-back-btn")?.addEventListener("click", goBack);
    document.getElementById("fillblank-restart-btn")?.addEventListener("click", initFillBlank);
    document.getElementById("qa-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("qa-back-btn")?.addEventListener("click", goBack);
    document.getElementById("history-home-btn")?.addEventListener("click", goToHome);
    document.getElementById("history-back-btn")?.addEventListener("click", goBack);
    document.getElementById("lang-de")?.addEventListener("click", () => setLanguage('de'));
    document.getElementById("lang-fr")?.addEventListener("click", () => setLanguage('fr'));
    document.querySelectorAll(".difficulty-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            currentDifficulty = btn.dataset.diff;
            document.querySelectorAll(".difficulty-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            initFillBlank();
        });
    });

    // Initial
    updateHomeTexts();
    renderTheory();
    renderQA();
    renderHistory();
    showScreen("home", false);
</script>
</body>
</html>
